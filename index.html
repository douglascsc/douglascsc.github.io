<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Douglas Camargo Carvalho</title>
<meta name="description" content="Professor EBTT, Área de Informação e Comunicação, IFSUL.">
<link rel="canonical" href="https://douglascsc.github.io/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23faf9f6'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='34' font-weight='600' fill='%231c1b19' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Douglas Camargo Carvalho">
<meta property="og:locale" content="pt_BR">
<meta property="og:url" content="https://douglascsc.github.io/">
<meta property="og:title" content="Douglas Camargo Carvalho">
<meta property="og:description" content="Professor EBTT, Área de Informação e Comunicação, IFSUL.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #faf9f6;
    --surface: #ffffff;
    --text: #1c1b19;
    --text-muted: #62615c;
    --text-faint: #706f68;
    --border: #e6e3da;
    --tech: #2f5fd6;
    --tech-bg: #eaf0fd;
    --educ: #1f8a5f;
    --educ-bg: #e7f5ee;
    --shadow: 0 1px 2px rgba(28,27,25,.04), 0 6px 20px rgba(28,27,25,.05);
    --shadow-hover: 0 4px 10px rgba(28,27,25,.06), 0 14px 30px rgba(28,27,25,.08);
    --radius: 18px;
    --serif: "Source Serif 4", Georgia, serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #15140f; --surface:#1f1e18; --text:#f2f0e8; --text-muted:#b2b0a5;
      --text-faint:#87857b; --border:#34322a; --tech:#7ea2ff; --tech-bg:#1c2740;
      --educ:#6fcf9e; --educ-bg:#16342a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
      --shadow-hover: 0 4px 10px rgba(0,0,0,.32), 0 18px 34px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --bg: #15140f; --surface:#1f1e18; --text:#f2f0e8; --text-muted:#b2b0a5;
    --text-faint:#87857b; --border:#34322a; --tech:#7ea2ff; --tech-bg:#1c2740;
    --educ:#6fcf9e; --educ-bg:#16342a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    --shadow-hover: 0 4px 10px rgba(0,0,0,.32), 0 18px 34px rgba(0,0,0,.4);
  }

  *{ box-sizing: border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: var(--sans); line-height:1.5; font-size:16px;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
  }
  a{ color:inherit; }
  a:focus-visible{ outline: 2px solid var(--tech); outline-offset: 3px; border-radius: 4px; }

  main{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding: 48px 24px; gap:48px;
  }

  @keyframes fade-up-in{
    from{ opacity:0; transform: translateY(8px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .avatar{
    width:96px; height:96px; border-radius:50%; object-fit:cover; display:block;
    margin:0 auto 18px; box-shadow: var(--shadow); border:1px solid var(--border);
    transition: transform .3s cubic-bezier(.4,0,.2,1), box-shadow .3s cubic-bezier(.4,0,.2,1);
    animation: fade-up-in .5s cubic-bezier(.16,1,.3,1) both;
  }
  .avatar:hover{ transform: scale(1.015); box-shadow: var(--shadow-hover); }

  h1{
    font-family: var(--serif); font-weight:600; font-size: clamp(22px, 4vw, 28px);
    margin:0; letter-spacing:-0.01em;
    animation: fade-up-in .5s cubic-bezier(.16,1,.3,1) .08s both;
  }
  .sub{
    font-size:14.5px; color: var(--text-muted); margin:8px 0 0;
    animation: fade-up-in .5s cubic-bezier(.16,1,.3,1) .16s both;
  }

  .tiles{
    display:flex; gap:22px; flex-wrap:wrap; justify-content:center;
    animation: fade-up-in .5s cubic-bezier(.16,1,.3,1) .26s both;
  }
  .tile{
    display:flex; flex-direction:column; align-items:center; gap:14px;
    width: 148px; padding: 30px 16px; text-decoration:none;
    background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow);
    transition: transform .25s cubic-bezier(.4,0,.2,1), box-shadow .25s cubic-bezier(.4,0,.2,1),
      background-color .25s cubic-bezier(.4,0,.2,1), border-color .25s cubic-bezier(.4,0,.2,1);
  }
  .tile:hover{
    transform: translateY(-3px);
    box-shadow: var(--shadow-hover);
    border-color: var(--border);
    background: color-mix(in srgb, var(--surface) 96%, var(--text) 4%);
  }
  .tile:active{
    transform: translateY(-1px);
    transition-duration: .12s;
  }

  .tile-icon{
    width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    transition: transform .25s cubic-bezier(.4,0,.2,1);
  }
  .tile.chamada .tile-icon{ background: var(--tech-bg); color: var(--tech); }
  .tile.sobre .tile-icon{ background: var(--educ-bg); color: var(--educ); }
  .tile:hover .tile-icon{ transform: scale(1.04); }

  .tile span{
    font-family: var(--sans); font-weight:600; font-size:14.5px; color: var(--text);
    transition: transform .25s cubic-bezier(.4,0,.2,1);
  }
  .tile:hover span{ transform: translateY(-1px); }

  @media (prefers-reduced-motion: reduce){
    .avatar, h1, .sub, .tiles{ animation: none; }
    .avatar, .tile, .tile-icon, .tile span, .social-link{ transition: none; }
    .tile:hover{ transform: none; }
    .tile:hover .tile-icon, .tile:hover span{ transform: none; }
    .avatar:hover{ transform: none; }
  }

  footer{ padding: 24px; display:flex; justify-content:center; align-items:center; gap:16px; }
  footer p{ margin:0; color: var(--text-faint); font-size:13px; }
  .social-link{
    display:inline-flex; align-items:center; color: var(--text-faint);
    transition: color .25s cubic-bezier(.4,0,.2,1), transform .25s cubic-bezier(.4,0,.2,1);
  }
  .social-link:hover{ color: var(--text); transform: translateY(-1px); }
  .social-link:active{ transform: translateY(0); }
</style>
</head>
<body>

<main>
  <div>
    <img class="avatar" src="fotos/retrato.jpg" alt="Retrato de Douglas Camargo Carvalho" loading="lazy" onerror="this.remove()">
    <h1>Douglas Camargo Carvalho</h1>
    <p class="sub">Professor EBTT · IFSUL</p>
  </div>

  <div class="tiles">
    <a class="tile chamada" href="https://douglascsc.github.io/chamada/">
      <span class="tile-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1Z"/><rect x="5" y="6" width="14" height="15" rx="2"/><path d="m9 13 2 2 4-4"/></svg>
      </span>
      <span>Chamada</span>
    </a>
    <a class="tile sobre" href="https://douglascsc.github.io/sobre/">
      <span class="tile-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/></svg>
      </span>
      <span>Me conheça</span>
    </a>
  </div>
</main>

<footer>
  <p>2026</p>
  <a class="social-link" href="https://www.instagram.com/prof.douglasc" target="_blank" rel="noopener" aria-label="Instagram: @prof.douglasc">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
  </a>
</footer>

</body>
</html>
